<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Swathi Quiz{% endblock %}</title>
<style>
:root{--ink:#14213d;--paper:#f5f7fa;--card:#fff;--line:#d9e0ea;--accent:#0b7a75;--gold:#b8860b;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--paper);line-height:1.55}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header a{color:#fff;text-decoration:none;margin-left:16px;font-family:system-ui,sans-serif;font-size:.95rem}
header .brand{font-size:1.2rem;margin:0;font-weight:700}
main{max-width:720px;margin:0 auto;padding:24px 18px}
h1,h2{line-height:1.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.btn,button{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:600 1rem system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--ink)}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;margin:8px 0 14px}
label.opt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
label.opt:hover{border-color:var(--accent)}
.err{color:var(--bad)}.ok{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.92rem}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <p class="brand">Swathi Quiz &amp; Certificates</p>
  <nav>
    <a href="{% url 'home' %}">Quizzes</a>
    <a href="{% url 'verify' %}">Verify certificate</a>
    {% if request.session.student_name %}<a href="{% url 'logout' %}">Sign out</a>{% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
